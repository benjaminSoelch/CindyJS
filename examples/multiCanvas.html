<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cindy JS</title>
        <script type="text/javascript" src="../build/js/Cindy.js"></script>
        <script type="text/javascript" src="../build/js/CindyGL.js"></script>
        <link rel="stylesheet" href="../css/cindy.css" />
    </head>

    <body style="font-family: Arial">
        <script id="csmouseclick" type="text/x-cindyscript">
            print(mouse());
        </script>
        <script id="csinit" type="text/x-cindyscript">
            
        </script>
        <script id="csdraw" type="text/x-cindyscript">
            setCanvas("left");
            drawtext((0,0),"left");
            setCanvas("right");
            drawtext((0,0),"right");
        </script>

        <div class="container" style="display: flex;width: 100vw;height: 100vh">
        <div class="container" style="display: flex;width: 50%;height: 100%">
            <canvas id="left" style="border: 0px"></canvas>
        </div>
        <div class="container" style="display: flex;width: 50%;height: 100%">
            <canvas id="right" style="border: 0px"></canvas>
        </div>
        </div>

        <script type="text/javascript">
            const cdy = CindyJS({
                canvasname: "CSCanvas",
                scripts: "cs*",
                animation: { autoplay: false },
                ports: [
                    {
                        id: "left",
                        fill: "parent",
                        transform: [{ visibleRect: [-3, -3, 3, 3] }],
                    },
                    {
                        id: "right",
                        fill: "parent",
                        transform: [{ visibleRect: [-3, -3, 3, 3] }],
                    },
                ],
            });
        </script>
    </body>
</html>
