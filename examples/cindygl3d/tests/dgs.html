<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cindy JS</title>
        <script type="text/javascript" src="../../../build/js/Cindy.js"></script>
        <script type="text/javascript" src="../../../build/js/CindyGL.js"></script>
        <link rel="stylesheet" href="../../../css/cindy.css" />
    </head>

    <body style="font-family: Arial">
        <script id="csmousedown" type="text/x-cindyscript">
            dgs3dHandleMouseDown()
        </script>
        <script id="csmouseup" type="text/x-cindyscript">
            dgs3dHandleMouseUp()
        </script>
        <script id="csinit" type="text/x-cindyscript">
            dgs3dPrepare();
            updateZoom():=(
                if(zoom>5,zoom=5);
                if(zoom<0.2,zoom=0.2);
                zoom3d(zoom);
                dgs3dHandleZoom(zoom);
            );
            cglDefaults_"sphereSize" = 0.1;
            cglDefaults_"cylinderSize" = 0.05;

            A = point3d((0,0,0));
            B = point3d((1,0,0));
            C = point3d((0,1,0));
            D = point3d((0,0,1));
            l1 = join3d(A,B);
            l2 = join3d(A,C);
            l3 = join3d(A,D);
            l4 = join3d(B,C);
            l5 = join3d(B,D);
            l6 = join3d(C,D);
            E = pointOnLine3d((0.5,0,0),l1);
            P1 = join3d(E,C,D);
            P2 = join3d(l2,B);
            l7 = meet3d(P1,P2);
            F = pointOnPlane3d((0.5,0.5,0.5),P1);
            P3 = join3d(A,D,F);
            l8 = join3d(F,D);
            G = meet3d(P2,l8);
            H = meet3d(P1,P2,P3);
        </script>
        <script id="csdraw" type="text/x-cindyscript">
            dgs3dPreFrame();

            cglRender3d();
        </script>

            <div id="CSCanvas" style="border: 0px"></div>

        <script type="text/javascript">
            // zoom using mouse wheel, inverted direction for compatability with old raycaster script
            window.addEventListener("wheel", // use only sign as value range may differ depending on browser
              event => cdy.evokeCS(`zoom=zoom*${Math.pow(0.95,Math.sign(event.deltaY))};updateZoom();`)
            );
            const cdy = CindyJS({
                canvasname: "CSCanvas",
                scripts: "cs*",
                animation: { autoplay: true },
                ports: [
                    {
                        id: "CSCanvas",
                        width: 512,
                        height: 512,
                        transform: [{ visibleRect: [-3, -3, 3, 3] }],
                    },
                ],
                import: {
                    "init": ["../../../plugins/cindygl/scripts/cgl3d.cjs","../../../plugins/cindygl/scripts/dgs.cjs"]
                }
            });
        </script>
    </body>
</html>
