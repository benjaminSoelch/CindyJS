<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cindy JS</title>
        <script type="text/javascript" src="../../../build/js/Cindy.js"></script>
        <script type="text/javascript" src="../../../build/js/CindyGL.js"></script>
        <link rel="stylesheet" href="../../../css/cindy.css" />
    </head>

    <body style="font-family: Arial">
        <script id="csmousedown" type="text/x-cindyscript">
            dgs3dHandleMouseDown()
        </script>
        <script id="csmouseup" type="text/x-cindyscript">
            dgs3dHandleMouseUp()
        </script>
        <script id="csinit" type="text/x-cindyscript">
            dgs3dPrepare();
            zoom = 1.0;
            updateZoom():=(
                if(zoom>5,zoom=5);
                if(zoom<0.2,zoom=0.2);
                zoom3d(zoom);
                dgs3dHandleZoom(zoom);
            );
            cglDefaults_"sphereSize" = 0.1;
            cglDefaults_"cylinderSize" = 0.05;
            dgs3dRenderPlane(p):=();//disable plane rendering

            A = point3d((1,0,0));
            B = point3d((0,1,0));
            E = point3d((0,0,1));
            C = point3d((1,1,0));
            D = point3d((1,0,1));
            F = point3d((0,1,1));
            l1 = join3d(A,B);
            l2 = join3d(C,D);
            l3 = join3d(E,F);
            P = pointOnLine3d((0,0,0),l1);
            Q = meet3d(join3d(P,l2),l3);
            l = join3d(P,Q);
            R = meet3d(l,join3d(l2,B));


            pos3d(p):=(p:"coords"_(1..3));
            pts = ();

            oldL1 = l1:"coords";
            oldL2 = l2:"coords";
            oldL3 = l3:"coords";

            sId = -1;
            update():=(
                // TODO move quadric by three lines to dgs.cjs
                M = dgs3dLineMatrix(l1:"coords")*dgs3dLineMatrix(dgs3dDualLine(l2:"coords"))*dgs3dLineMatrix(l3:"coords");
                M = M + transpose(M);
                if(sId != -1,
                    cglUpdate(sId,UM->M);
                ,
                    sId = surface3d((x,y,z,1)*M*(x,y,z,1),alpha->0.75,degree->2,plotModifiers->{"M":M},
                    color->(1,0,.5),layers->2);
                );
            );
            update();
        </script>
        <script id="csdraw" type="text/x-cindyscript">
            dgs3dPreFrame();

            if(oldL1 != l1:"coords" % oldL2 != l2:"coords" % oldL3 != l3:"coords",
                oldL1 = l1:"coords";
                oldL2 = l2:"coords";
                oldL3 = l3:"coords";
                update();
            );

            cglRender3d();
        </script>

            <div id="CSCanvas" style="border: 0px"></div>

        <script type="text/javascript">
            // zoom using mouse wheel, inverted direction for compatability with old raycaster script
            window.addEventListener("wheel", // use only sign as value range may differ depending on browser
              event => cdy.evokeCS(`zoom=zoom*${Math.pow(0.95,Math.sign(event.deltaY))};updateZoom();`)
            );
            const cdy = CindyJS({
                canvasname: "CSCanvas",
                scripts: "cs*",
                animation: { autoplay: true },
                ports: [
                    {
                        id: "CSCanvas",
                        width: 512,
                        height: 512,
                        transform: [{ visibleRect: [-3, -3, 3, 3] }],
                    },
                ],
                import: {
                    "init": ["../../../plugins/cindygl/scripts/cgl3d.cjs","../../../plugins/cindygl/scripts/dgs.cjs","../../../plugins/cindygl/scripts/surfaceInterpolate.cjs"]
                }
            });
        </script>
    </body>
</html>
