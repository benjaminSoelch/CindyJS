<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cindy JS</title>
        <script type="text/javascript" src="../../../build/js/Cindy.js"></script>
        <script type="text/javascript" src="../../../build/js/CindyGL.js"></script>
        <link rel="stylesheet" href="../../../css/cindy.css" />
    </head>

    <body style="font-family: Arial">
        <script id="csmousedown" type="text/x-cindyscript">
            dgs3dHandleMouseDown()
        </script>
        <script id="csmouseup" type="text/x-cindyscript">
            dgs3dHandleMouseUp()
        </script>
        <script id="csinit" type="text/x-cindyscript">
            dgs3dPrepare();
            zoom = 1.0;
            updateZoom():=(
                if(zoom>5,zoom=5);
                if(zoom<0.2,zoom=0.2);
                zoom3d(zoom);
                dgs3dHandleZoom(zoom);
            );
            cglDefaults_"sphereSize" = 0.1;
            cglDefaults_"cylinderSize" = 0.05;

            A = point3d((1,1,1),color->cglWhite);
            pts1 = apply(1..9,
                point3d((random(),random(),random()),size->0.05)
            );
            Q1 = quadricBy9Points(pts1,color->cglYellow);
            pts2 = apply(1..9,
                point3d((random(),random(),random()),size->0.05)
            );
            Q2 = quadricBy9Points(pts2,color->cglGreen);

            q1 = dgs3dPolar(Q1,A,visible->false);
            q2 = dgs3dPolar(Q2,A,visible->false);
            l = meet3d(q1,q2,color->(.5,.5,.5));

            Y = point3d((0,0,0),pinned->true,visible->false);
            l:"children" = append(l:"children",Y);
            Y:"parents" = [l];
            Y:"recompute" = cglLazy(self,
                regional(l,PQ,v,n);
                l = self:"parents"_1;
                PQ = transpose(kernel(dgs3dLineMatrix(l:"coords")));
                v = (PQ_1 * PQ_2_4 - PQ_2*PQ_1_4)_(1..3);
                n = (v_1,v_2,v_3,-v*((A:"coords"_(1..3))/(A:"coords"_4)));
                self:"coords" = dgs3dEpsilon46(n,l:"coords");
                DGS3DmOVEoK
            );
            cglEval(Y:"recompute",Y);
            l2 = join3d(A,Y);
            // TODO: find linear combination of Q1,Q2 such that l2 is normal to polar-plane (?polar is linear comb of q1,q2)

        </script>
        <script id="csdraw" type="text/x-cindyscript">
            dgs3dPreFrame();

            cglRender3d();
        </script>

            <div id="CSCanvas" style="border: 0px"></div>

        <script type="text/javascript">
            // zoom using mouse wheel, inverted direction for compatability with old raycaster script
            window.addEventListener("wheel", // use only sign as value range may differ depending on browser
              event => cdy.evokeCS(`zoom=zoom*${Math.pow(0.95,Math.sign(event.deltaY))};updateZoom();`)
            );
            const cdy = CindyJS({
                canvasname: "CSCanvas",
                scripts: "cs*",
                animation: { autoplay: true },
                ports: [
                    {
                        id: "CSCanvas",
                        width: 512,
                        height: 512,
                        transform: [{ visibleRect: [-3, -3, 3, 3] }],
                    },
                ],
                import: {
                    "init": ["../../../plugins/cindygl/scripts/cgl3d.cjs","../../../plugins/cindygl/scripts/dgs.cjs","../../../plugins/cindygl/scripts/surfaceInterpolate.cjs"]
                }
            });
        </script>
    </body>
</html>
