<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Cindy JS</title>
        <script type="text/javascript" src="../../build/js/Cindy.js"></script>
        <script type="text/javascript" src="../../build/js/CindyGL.js"></script>
        <link rel="stylesheet" href="../../css/cindy.css" />
    </head>

    <body style="font-family: Arial">
        <script id="csmousedown" type="text/x-cindyscript">
            x0 = mouse().x;
            y0 = mouse().y;
            dragging = x0 < 2;
        </script>
        <script id="csmouseup" type="text/x-cindyscript">
            dragging = false;
        </script>
        <script id="csinit" type="text/x-cindyscript">
            use("CindyGL");

            sx = mouse().x;
            sy = mouse().y;
            dragging = false;

            updateZoom():=(
              if(zoom>5,zoom=5);
              if(zoom<0.2,zoom=0.2);
            );
        </script>
        <script id="csdraw" type="text/x-cindyscript">
            if (dragging,
                dx = 0.5*(mouse().x -sx); dy = 0.5*(mouse().y -sy);
                rotate3d(dx,dy);
            );
            sx = mouse().x;
            sy = mouse().y;

            frameUpdate();
        </script>

        <div class="container" style="display: flex;width: 100%;height: 100vh;">
            <div id="CSCanvas" style="border: 0px"></div>
<!--no indentation to ensure text is aligned correctly-->
<div class="container" style="display: flex;flex-direction: column;width: 50%;height: 100vh; margin-left: auto;">
<textarea id="exampleCode" style="width: 100%;height: 75%; margin-left: auto;">
/*forall((1,-1),x,forall((1,-1),y,
    draw3d((x,y,1),(x,y,-1));
    draw3d((x,1,y),(x,-1,y));
    draw3d((1,x,y),(-1,x,y));
    forall((1,-1),z,
        draw3d((x,y,z));
    )
));*/

a = cgl3dnewObject(cglDepth=1;(1,0,0));

b = cgl3dnewSphere(cgl3d.shader.sphere:(#,false),(0,0,-1),1,plotModifiers->{
  "cglPixelExpr":(s,t,n)=>(0,1,0),"cglLight":cgl3d.light.default,"cglProjection":cgl3d.projection.sphereEquirect
});
cylinderModifiers = {"cglLight": cgl3d.light.default,
    "cglCap1front":cglCapVoidShader,"cglCap1back":cglCapOpenShaderBack,
    "cglCap2front":cglCapVoidShader,"cglCap2back":cglCapOpenShaderBack,
    "cglCylinderProjGetDirection1":cglCylinderProjGetDirection1Default,
    "cglCut1":cglCutOrthogonal,"cglCut2":cglCutOrthogonal,
    "cglGetCutVector1":cglCutVectorNone,"cglGetCutVector2":cglCutVectorNone,
    "cglCapCut1":cglCapCutFlat1,"cglCapCut2":cglCapCutFlat2,
    "cglProjection": cgl3d.projection.cylinder,
    "cglPixelExpr":(s,t,n)=>(0,0,1)
};
c = cgl3dnewCylinder(cgl3d.shader.cylinder:(#),(0,1,0),(0,.25,0),0.75,plotModifiers->cylinderModifiers);
torusModifiers = {"cglLight": cgl3d.light.default,
    "cglTorusProjGetDirection1":cglTorusProjGetDirection1Default,
    "cglCheckAngle1":(texPos)=>(0;),"cglCheckAngle2":(texPos)=>(0;),
    "cglRadii":(1,0.2),
    "cglProjection": cgl3d.projection.torus,
    "cglPixelExpr":(s,t,n)=>(0,0,1)
};
c = cgl3dnewCylinder(cgl3d.shader.torus:(#,1),(0,0,0),(0,1,0),1.2,plotModifiers->torusModifiers);
d = cgl3dnewMesh(cgl3d.shader.triangle:(#),((1,0,0),(0,1,0),(0,0,1)),plotModifiers->{
  "cglPixelExpr":(s,t,n)=>(1,1,0),"cglLight":cgl3d.light.default,"cglTextureMapping":(cglSpacePos,direction)=>(0),"cglNormalExpr":(cglSpacePos,texCoord)=>((1,1,1)/sqrt(3)),
});

e = cgl3dnewCuboid((0,1,1),(0,0,0),(.5,0,0),(0,.5,0),(0,0,.5));

</textarea>
<textarea id="frameUpdate" style="width: 100%;height: 25%;margin-left: auto;">
  cgl3dStartRender(layers->0);
  cgl3dSetRenderTransform(cgl3d.renderTransform,cgl3d.zoomFactor);
  cgl3dRenderOpaque([a,b,c,d,e]);
  cgl3dRenderTranslucent([]);
  cgl3dFinishRender();
</textarea>
</div>
<!--
N=12;
samples=apply(0..(N-1),y,apply(0..(N-1),x,
   a=2*pi*x/N;b=2*pi*y/N;
   ((2+sin(b))*sin(a),(2+sin(b))*cos(a),cos(b)+0.5*sin(a))
));
mesh3d(samples,topology->TopologyCloseX+TopologyCloseY);
-->
        </div>

        <script type="text/javascript">
            const textarea = document.getElementById('exampleCode');
            textarea.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    cdy.evokeCS("reset3d();"+textarea.value+";");
                }
            });
            const frameTextArea = document.getElementById('frameUpdate');
            frameTextArea.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    cdy.evokeCS("frameUpdate():=("+frameTextArea.value+");");
                }
            });
            function redrawScene(){
                cdy.evokeCS("frameUpdate():=("+frameTextArea.value+");");
                cdy.evokeCS("reset3d();"+textarea.value+";");
            }
            setTimeout(function() { redrawScene(); }, 100); // 100ms delay to allow CS initscript to execute
            setTimeout(function() { redrawScene(); }, 1000); // 1s should be enough to ensure that everythign is loaded
            // zoom using mouse wheel, inverted direction for compatability with old raycaster script
            window.addEventListener("wheel", // use only sign as value range may differ depending on browser
              event => cdy.evokeCS(`zoom=zoom*${Math.pow(0.95,Math.sign(event.deltaY))};updateZoom();`)
            );
            const cdy = CindyJS({
                canvasname: "CSCanvas",
                scripts: "cs*",
                animation: { autoplay: true },
                ports: [
                    {
                        id: "CSCanvas",
                        width: 512,
                        height: 512,
                        transform: [{ visibleRect: [-3, -3, 3, 3] }],
                    },
                ],
                import: {
                    "init": ["../../plugins/cindygl/scripts/cgl3d.cjs",
                    //"../../plugins/cindygl/scripts/dgs.cjs","../../plugins/cindygl/scripts/surfaceInterpolate.cjs","../../plugins/cindygl/scripts/marchingCubes.cjs"
                    ]
                },
                images: { earthCylinder: "./images/Lambert.jpg", earth: "./images/Equirectangular.jpg"},
            });
        </script>
    </body>
</html>
